name: "Checks before merging"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - '*'

jobs:
  lint-python:
    runs-on: linux-arm64-1
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/check-python

      - name: Run Django checks
        run: uv run python manage.py check --deploy

      - uses: ./.github/actions/check-migrations
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}